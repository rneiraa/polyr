name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        polars: ["latest"]
        include:
          - { os: ubuntu-latest, python: "3.10", polars: "1.30.0" }
          - { os: windows-latest, python: "3.12", polars: "latest" }
          - { os: macos-latest, python: "3.12", polars: "latest" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - if: matrix.polars != 'latest'
        run: pip install "polars==${{ matrix.polars }}"
      - run: pytest -q
