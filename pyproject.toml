[project]
name = "polyr"
version = "0.2.0b1"
description = "La gramática de dplyr en Python, con la misma semántica, sobre polars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["polars>=1.30"]
keywords = ["dplyr", "tidyverse", "polars", "dataframe", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rneiraa/polyr"
Issues = "https://github.com/rneiraa/polyr/issues"
Changelog = "https://github.com/rneiraa/polyr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E701", "E731", "B905"]
